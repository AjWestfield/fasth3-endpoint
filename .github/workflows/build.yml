name: build-image
on: { push: { branches: [main] }, workflow_dispatch: {} }
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space (base image is ~20GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker system prune -af || true
          df -h /
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/ajwestfield/fasth3-endpoint:latest
            ghcr.io/ajwestfield/fasth3-endpoint:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/AjWestfield/fasth3-endpoint
